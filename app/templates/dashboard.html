<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Secure File Sharing</title>
</head>

<body>

    <h1>Welcome, {{ current_user.username }}!</h1>

    <p>Secure File Sharing Dashboard</p>

    <hr>

    <h2>Upload File</h2>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <input
            type="file"
            name="file"
            required
        >

        <button type="submit">
            Upload File
        </button>
    </form>

    <hr>

    <h2>Your Files</h2>

    {% if files %}

        {% for file in files %}

            <div>

                <strong>{{ file.original_filename }}</strong>

                <br><br>

                <a href="/download/{{ file.id }}">
                    Download
                </a>

                <form
                    action="/delete/{{ file.id }}"
                    method="POST"
                    style="display: inline;"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button type="submit">
                        Delete
                    </button>
                </form>

                <br><br>

                <form
                    action="/share/{{ file.id }}"
                    method="POST"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <label>
                        Share with username:
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                    <button type="submit">
                        Share File
                    </button>

                </form>

            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>You have not uploaded any files yet.</p>

    {% endif %}

    <br>

    <a href="/files">
        My Files
    </a>

    <br><br>

    <a href="/shared-with-me">
        Shared With Me
    </a>

    <br><br>

    <a
        href="/logout"
        onclick="return confirm('Are you sure you want to logout?');"
    >
        Logout
    </a>

</body>

</html>
