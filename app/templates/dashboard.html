<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Secure File Sharing</title>
</head>

<body>

    <h1>Secure File Sharing Dashboard</h1>

    <h2>Welcome!</h2>

    <p>You are successfully logged in.</p>

    <hr>

    <h3>Upload a File</h3>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <br><br>

        <button type="submit">Upload File</button>

    </form>

    <hr>

    <h3>Your Files</h3>

    {% if files %}

        {% for file in files %}

            <p>
                {{ file.original_filename }}

                <a href="/download/{{ file.id }}">
                    Download
                </a>

                <form action="/delete/{{ file.id }}" method="POST" style="display: inline;">
                    <button type="submit">Delete</button>
                </form>
            </p>

        {% endfor %}

    {% else %}

        <p>No files uploaded yet.</p>

    {% endif %}

    <br>
    
    <a href="/files">My Files</a>

    <br><br>

    <a href="/logout" onclick="return confirm('Are you sure you want to logout?');">
        Logout
    </a>

</body>

</html>
