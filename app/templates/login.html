<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Secure File Sharing</title>
</head>

<body>

    <h1>Login</h1>

    <form action="/login" method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>
            Username:
        </label>

        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>
            Password:
        </label>

        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <a href="/register">
        Create a new account
    </a>

    <br><br>

    <a href="/">
        Back to Home
    </a>

</body>

</html>
