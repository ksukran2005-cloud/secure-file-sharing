<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Files - Secure File Sharing</title>
</head>

<body>

    <h1>My Files</h1>

    <p>These are your uploaded files.</p>

    <hr>

    {% if files %}

        {% for file in files %}

            <div>

                <strong>{{ file.original_filename }}</strong>

                <br><br>

                <a href="/download/{{ file.id }}">
                    Download
                </a>

                <form
                    action="/delete/{{ file.id }}"
                    method="POST"
                    style="display: inline;"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button type="submit">
                        Delete
                    </button>
                </form>

                <br><br>

                <form
                    action="/share/{{ file.id }}"
                    method="POST"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <label>
                        Share with username:
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                    <button type="submit">
                        Share File
                    </button>

                </form>

            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>You have not uploaded any files yet.</p>

    {% endif %}

    <a href="/dashboard">
        Back to Dashboard
    </a>

    <br><br>

    <a href="/logout">
        Logout
    </a>

</body>

</html>
